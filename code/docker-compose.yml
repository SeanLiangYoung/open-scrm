# Docker Compose配置 - 开发环境（基础设施 + 全部后端微服务）
# 在 code/ 目录执行: docker compose up -d --build
#
# 说明：凡使用 scrm-backend 镜像的服务都必须带 build，否则 Compose 会尝试从仓库拉取而失败。

# 各业务服务共用（数据库在 postgres 容器中初始化：POSTGRES_DB + init-db.pg.sql）
x-backend-env: &backend-env
  NODE_ENV: production
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_USERNAME: postgres
  DB_PASSWORD: root123
  DB_DATABASE: scrm_dev
  REDIS_HOST: redis
  REDIS_PORT: '6379'

x-gateway-env: &gateway-env
  <<: *backend-env
  AUTH_SERVICE_URL: http://auth-service:7001
  CUSTOMER_SERVICE_URL: http://customer-service:7002
  ACQUISITION_SERVICE_URL: http://acquisition-service:7003
  OPERATION_SERVICE_URL: http://operation-service:7004
  ASSET_SERVICE_URL: http://asset-service:7005
  ANALYTICS_SERVICE_URL: http://analytics-service:7006
  INTEGRATION_SERVICE_URL: http://integration-service:7007
  MESSAGE_SERVICE_URL: http://message-service:7008
  FINANCE_SERVICE_URL: http://finance-service:7009

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

services:
  # PostgreSQL 16（应用默认连接见各服务 config.default.ts / 环境变量）
  postgres:
    image: postgres:16-alpine
    container_name: scrm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root123
      POSTGRES_DB: scrm_dev
      TZ: Asia/Shanghai
    # 宿主机若已有 PostgreSQL 占用 5432，映射到 5433 供本机工具连接；容器内仍为 5432
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.pg.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - scrm-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d scrm_dev']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Redis 7.0
  redis:
    image: redis:7.0-alpine
    container_name: scrm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - scrm-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 5s

  # MongoDB 6.0
  mongodb:
    image: mongo:6.0
    container_name: scrm-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      TZ: Asia/Shanghai
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - scrm-network
    restart: unless-stopped

  # RabbitMQ 3.x
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: scrm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"   # AMQP端口
      - "15672:15672" # 管理界面
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - scrm-network
    restart: unless-stopped

  # Prometheus (可选)
  prometheus:
    image: prom/prometheus:latest
    container_name: scrm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - scrm-network
    restart: unless-stopped

  # Grafana (可选)
  grafana:
    image: grafana/grafana:latest
    container_name: scrm-grafana
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - scrm-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # ========== 后端微服务（镜像 scrm-backend:latest，由根目录 Dockerfile 构建）==========
  auth-service:
    image: scrm-backend:latest
    build: *backend-build
    container_name: scrm-auth-service
    working_dir: /app/services/auth-service
    command: ['node', 'bootstrap.js']
    ports:
      - '7001:7001'
    environment:
      <<: *backend-env
    networks:
      - scrm-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  customer-service:
    image: scrm-backend:latest
    build: *backend-build
    container_name: scrm-customer-service
    working_dir: /app/services/customer-service
    command: ['node', 'bootstrap.js']
    ports:
      - '7002:7002'
    environment:
      <<: *backend-env
    networks:
      - scrm-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  acquisition-service:
    image: scrm-backend:latest
    build: *backend-build
    container_name: scrm-acquisition-service
    working_dir: /app/services/acquisition-service
    command: ['node', 'bootstrap.js']
    ports:
      - '7003:7003'
    environment:
      <<: *backend-env
      # 本地 Docker 无真实 OSS 时满足 @midwayjs/oss 校验；真实环境请改为自己的 endpoint/bucket/密钥
      OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
      OSS_BUCKET: docker-dev-placeholder
      OSS_ACCESS_KEY_ID: docker-dev-placeholder
      OSS_ACCESS_KEY_SECRET: docker-dev-placeholder
    networks:
      - scrm-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  operation-service:
    image: scrm-backend:latest
    build: *backend-build
    container_name: scrm-operation-service
    working_dir: /app/services/operation-service
    command: ['node', 'bootstrap.js']
    ports:
      - '7004:7004'
    environment:
      <<: *backend-env
    networks:
      - scrm-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  asset-service:
    image: scrm-backend:latest
    build: *backend-build
    container_name: scrm-asset-service
    working_dir: /app/services/asset-service
    command: ['node', 'bootstrap.js']
    ports:
      - '7005:7005'
    environment:
      <<: *backend-env
      OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
      OSS_BUCKET: docker-dev-placeholder
      OSS_ACCESS_KEY_ID: docker-dev-placeholder
      OSS_ACCESS_KEY_SECRET: docker-dev-placeholder
    networks:
      - scrm-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  analytics-service:
    image: scrm-backend:latest
    build: *backend-build
    container_name: scrm-analytics-service
    working_dir: /app/services/analytics-service
    command: ['node', 'bootstrap.js']
    ports:
      - '7006:7006'
    environment:
      <<: *backend-env
    networks:
      - scrm-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  integration-service:
    image: scrm-backend:latest
    build: *backend-build
    container_name: scrm-integration-service
    working_dir: /app/services/integration-service
    command: ['node', 'bootstrap.js']
    ports:
      - '7007:7007'
    environment:
      <<: *backend-env
      CUSTOMER_SERVICE_URL: http://customer-service:7002
    networks:
      - scrm-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      customer-service:
        condition: service_started
      auth-service:
        condition: service_started
    restart: unless-stopped

  message-service:
    image: scrm-backend:latest
    build: *backend-build
    container_name: scrm-message-service
    working_dir: /app/services/message-service
    command: ['node', 'bootstrap.js']
    ports:
      - '7008:7008'
    environment:
      <<: *backend-env
    networks:
      - scrm-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  finance-service:
    image: scrm-backend:latest
    build: *backend-build
    container_name: scrm-finance-service
    working_dir: /app/services/finance-service
    command: ['node', 'bootstrap.js']
    ports:
      - '7009:7009'
    environment:
      <<: *backend-env
    networks:
      - scrm-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  gateway-service:
    image: scrm-backend:latest
    build: *backend-build
    container_name: scrm-gateway-service
    working_dir: /app/services/gateway-service
    command: ['node', 'bootstrap.js']
    # 宿主机 7000 常被 macOS AirPlay 占用；开发环境映射到 17000，容器内仍为 7000
    ports:
      - '17000:7000'
    environment:
      <<: *gateway-env
    networks:
      - scrm-network
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      customer-service:
        condition: service_started
      acquisition-service:
        condition: service_started
      operation-service:
        condition: service_started
      asset-service:
        condition: service_started
      analytics-service:
        condition: service_started
      integration-service:
        condition: service_started
      message-service:
        condition: service_started
      finance-service:
        condition: service_started
    restart: unless-stopped

networks:
  scrm-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:

