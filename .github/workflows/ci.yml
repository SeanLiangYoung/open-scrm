# S7-1：CI 门禁 — 单元测试 + TypeScript 类型检查（在 monorepo code/ 下）
# 全量 E2E 依赖本地/Compose 起全栈，仍由开发者或夜间任务执行；见 code/docs/迭代计划-E2E.md §2.5.1
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

defaults:
  run:
    working-directory: code

jobs:
  unit-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: code/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (Vitest)
        run: pnpm test:unit

      - name: Type check
        run: pnpm type-check
